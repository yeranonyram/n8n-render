services:
  - type: web
    name: n8n
    runtime: docker
    plan: free

    envVars:
      - key: PORT
        value: "5678"

      - key: N8N_PORT
        value: "5678"

      - key: N8N_LISTEN_ADDRESS
        value: "0.0.0.0"

      - key: N8N_PROTOCOL
        value: "https"

      - key: N8N_HOST
        value: "n8n-9b0m.onrender.com"

      - key: WEBHOOK_URL
        value: "https://n8n-9b0m.onrender.com/"

      - key: N8N_EDITOR_BASE_URL
        value: "https://n8n-9b0m.onrender.com/"

      - key: DB_TYPE
        value: "postgresdb"

      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-postgres
          property: host

      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-postgres
          property: port

      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-postgres
          property: database

      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-postgres
          property: user

      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password

      - key: N8N_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: n8n-postgres
    plan: free